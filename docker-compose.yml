services:
  postgres:
    image: postgres:16-alpine
    container_name: raylive-postgres
    restart: always
    environment:
      POSTGRES_DB: raylive_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d raylive_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: raylive-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: raylive_db
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/raylive_db

volumes:
  postgres_data:
